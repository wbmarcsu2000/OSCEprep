<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2b1c6e" />
    <meta
      name="description"
      content="ClerkTools — an Internal Medicine clerkship toolkit: full OSCE cases, framework drills, shelf MCQs, differentials, work-up & management, and skill references, with instant feedback and teaching."
    />
    <title>ClerkTools — IM Clerkship Toolkit</title>

    <!-- Open Graph / link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ClerkTools — IM Clerkship Toolkit" />
    <meta
      property="og:description"
      content="An Internal Medicine clerkship toolkit: OSCE cases, drills, shelf MCQs, differentials, work-up & management, and skill references — with instant feedback and teaching. For medical education only."
    />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <!--
      Static boot screen, inlined so it costs no extra request and paints
      immediately. Without it #root was empty until the whole JS bundle had
      downloaded, parsed and mounted — on a 1-2 Mbps ward connection that is
      10-30s of blank white, which reads as "the app is broken". React's
      createRoot() replaces this on mount.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.875rem;
        background: #f5f4fc;
        font-family: Nunito, ui-sans-serif, system-ui, sans-serif;
        color: #2b1c6e;
      }
      #boot .mark {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 3rem;
        width: 3rem;
        border-radius: 0.875rem;
        background: linear-gradient(135deg, #6d4aff, #2b1c6e);
        color: #fff;
        font-size: 1.5rem;
        font-weight: 800;
        box-shadow: 0 4px 16px rgba(43, 28, 110, 0.25);
      }
      #boot .name {
        font-size: 1.0625rem;
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      #boot .hint {
        font-size: 0.8125rem;
        color: #6e6b8a;
      }
      #boot .bar {
        width: 9rem;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(109, 74, 255, 0.16);
      }
      #boot .bar i {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: #6d4aff;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .bar i { animation: none; width: 100%; }
      }
    </style>
    <div id="root">
      <div id="boot">
        <div class="mark" aria-hidden="true">✚</div>
        <div class="name">ClerkTools</div>
        <div class="bar" role="progressbar" aria-label="Loading ClerkTools"><i></i></div>
        <div class="hint">Loading your clerkship toolkit…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
